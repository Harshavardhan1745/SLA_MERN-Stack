<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="schedule.css">
    <link rel="shortcut icon" href="../assets/favicon_io (1)/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-gray-100">
    <main class="grid grid-cols-[280px_1fr] h-screen">
        <aside class="bg-white shadow-2xl ">
            <!-- logo -->
            <div class="flex items-center gap-2 p-2">
                <img src="../assets/dashboard_logo.png" alt="logo" width="90" height="90" class="pb-2">
                <div class="flex flex-col">
                    <h1 class="text-2xl font-bold leading-none">
                        <span class="text-[#082850]">BUILD</span><span class="text-orange-600">TRACK</span>
                    </h1>

                    <p class="text-xs text-gray-400 mt-1">
                        Construction Project Monitoring
                    </p>
                </div>
            </div>
            <hr>

            <!-- menu -->

            <div class="flex flex-col justify-between">
                <ul class="flex flex-col gap-6 p-4">
                    <li><a href="../adminPanal/adminDashboard.html"
                            class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
                    <li><a href="projectDetails.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-trowel-bricks"></i> Projects</a></li>
                    <li><a href="workerDetails.html" class="p-2 rounded-lg  hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-users"></i>
                            Workers</a></li>
                    <li><a href="materialsDetails.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-box"></i> Materials</a></li>
                    <li><a href="Schedule.html" class="p-2 rounded-lg bg-[#082850] text-white"><i
                                class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                    <li><a href="siteMonitoring.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-location-dot"></i> Site Monitoring</a></li>
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-chart-line"></i> Reports</a></li>
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-triangle-exclamation"></i> Issues</a></li>
                </ul>
                <hr>
                <ul class="flex flex-col gap-6 p-4">
                    <li><a href="#" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-gear"></i> Settings</a></li>
                    <li><a href="adminPanel.html" class="p-2 rounded-lg hover:bg-[#082850] hover:text-white"><i
                                class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </div>
        </aside>

        <!-- main content -->

        <section class="bg-gray-100 p-3 overflow-y-auto">

            <div class="bg-white p-3 rounded shadow-lg">
                <div class="flex justify-between items-center">
                    <div class="flex flex-col gap-2 mx-4">
                        <h1 class="text-3xl text-[#082850] font-bold"><i class="fa-solid fa-calendar-days"></i> Schedule</h1>
                        <!-- <p class="text-gray-500 mx-3">Monitor all construction sites</p> -->
                    </div>
                    <div class=" flex gap-2 items-center ">
                        <div class="relative w-80">
                            <i
                                class="fa-solid fa-magnifying-glass absolute left-3  top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" placeholder="Search Schedule ..."
                                class="w-80 h-12 border border-gray-300 rounded-lg pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-gray-500">
                        </div>
                        <button
                            class="flex items-center gap-2 h-12 px-6 bg-[#082850] text-white rounded-xl shadow-lg hover:bg-[#0b3568] hover:scale-105 transition-all duration-300 whitespace-nowrap"><i
                                class="fa-solid fa-plus"></i> Add Schedule </button>
                    </div>
                </div>
            </div>

            <!-- summary -->

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 mt-4">
                <div class="summary-card bg-white p-3 rounded-tl-full rounded-br-full shadow hover:scale-105 duration-300 ">
                    <div>
                        <div class="flex flex-col gap-2 justify-center items-center">
                           <h1 class="text-xl font-medium "> 📅 Total</h1>
                           <h1 class="counter text-4xl font-bold" data-target="48">48</h1>
                           <p class="text-gray-500">All Tasks</p>
                        </div>
                    </div>
                </div>
                <div class="summary-card bg-white p-3 rounded-tl-full rounded-br-full shadow hover:scale-105 duration-300 ">
                    <div>
                        <div class="flex flex-col gap-2 justify-center items-center">
                           <h1 class="text-xl font-medium "> ⏳ Pending </h1>
                           <h1 class="counter text-4xl font-bold" data-target="12">12</h1>
                           <p class="text-gray-500">Need Review</p>
                        </div>
                    </div>
                </div>
                <div class="summary-card bg-white p-3 rounded-tl-full rounded-br-full shadow hover:scale-105 duration-300 ">
                    <div>
                        <div class="flex flex-col gap-2 justify-center items-center">
                           <h1 class="text-xl font-medium ">🚧 Progress</h1>
                           <h1 class="counter text-4xl font-bold" data-target="18">18</h1>
                           <p class="text-gray-500">Active Work </p>
                        </div>
                    </div>
                </div>
                <div class="summary-card bg-white p-3 rounded-tl-full rounded-br-full shadow hover:scale-105 duration-300 ">
                    <div>
                        <div class="flex flex-col gap-2 justify-center items-center">
                           <h1 class="text-xl font-medium ">✅ Completed</h1>
                           <h1 class="counter text-4xl font-bold" data-target="30">30</h1>
                           <p class="text-gray-500">Finished </p>
                        </div>
                    </div>
                </div>  
            </div>

        </section>
    </main>
    
    <script>
    window.onload = () => {
    const cards = document.querySelectorAll(".summary-card");
    cards.forEach((card,index)=>{
        setTimeout(()=>{
            card.classList.add("show");
        },index*250);
    });
}
     
    const counters = document.querySelectorAll(".counter") 
    // console.log(counters);
    
    counters.forEach(counters=>{
        let target = +counters.dataset.target
        let count = 0   
        let interval = setInterval(()=>{
            count++
            counters.innerHTML = count
            
            if(count>=target){
                clearInterval(interval)   
            }
        },100)
    })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/c219e56bfb.js" crossorigin="anonymous"></script>
</body>
</html>
